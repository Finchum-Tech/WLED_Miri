<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OKLab Gamut 3D</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: rgba(12, 16, 22, 0.82);
      --line: rgba(255, 255, 255, 0.12);
      --txt: #d9e0ea;
      --dim: #92a1b4;
      --accent: #7ab6ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #111826 0%, var(--bg) 55%);
      overflow: hidden;
      font-family: "Segoe UI", Inter, Roboto, sans-serif;
      color: var(--txt);
    }

    #view {
      width: 100%;
      height: 100%;
      display: block;
    }

    #ui {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 20;
      min-width: 280px;
      max-width: min(90vw, 380px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    p {
      margin: 0 0 10px 0;
      color: var(--dim);
      font-size: 12px;
      line-height: 1.35;
    }

    .row {
      display: grid;
      grid-template-columns: 72px 1fr 42px;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .row:last-of-type {
      margin-bottom: 10px;
    }

    .row label {
      color: var(--dim);
      font-size: 12px;
    }

    .row input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .value {
      text-align: right;
      font-size: 12px;
      color: var(--txt);
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--txt);
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(122, 182, 255, 0.6);
    }

    #status {
      margin-top: 8px;
      font-size: 11px;
      color: var(--dim);
      min-height: 16px;
    }

    #sliceDock {
      position: fixed;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 58px;
      padding: 10px 8px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    #sliceSliderWrap {
      width: 36px;
      height: 256px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sliceDepth {
      width: 246px;
      height: 18px;
      margin: 0;
      transform: rotate(-90deg);
      transform-origin: center;
      accent-color: var(--accent);
    }

    .sliceLabel {
      font-size: 10px;
      letter-spacing: 0.02em;
      color: var(--dim);
      text-transform: uppercase;
    }

    #sliceDepthVal {
      font-size: 11px;
      color: var(--txt);
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: center;
    }

    #hoverReadout {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 20;
      min-width: 240px;
      max-width: min(92vw, 360px);
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      font-size: 12px;
      line-height: 1.35;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px 10px;
      align-items: center;
    }

    #hoverSwatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(0, 0, 0, 0.3);
      grid-row: 1 / span 2;
    }

    #hoverTitle {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.02em;
    }

    #hoverValues {
      font-variant-numeric: tabular-nums;
      word-spacing: 1px;
    }

    #hoverActions {
      grid-column: 1 / -1;
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .copyBtn {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      color: var(--txt);
      background: rgba(255, 255, 255, 0.06);
    }

    .copyBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui">
    <h1>OKLab Gamut Shape</h1>
    <p>Drag to orbit, wheel to zoom. This is the in-gamut OKLab boundary rendered as a 3D mesh.</p>

    <div class="row">
      <label for="hSteps">Hue steps</label>
      <input id="hSteps" type="range" min="72" max="320" step="8" value="168" />
      <div class="value" id="hStepsVal">168</div>
    </div>

    <div class="row">
      <label for="lSteps">L steps</label>
      <input id="lSteps" type="range" min="24" max="140" step="2" value="82" />
      <div class="value" id="lStepsVal">82</div>
    </div>

    <div class="actions">
      <button id="rebuild">Rebuild Mesh</button>
      <button id="toggleWire">Toggle Wireframe</button>
    </div>

    <div id="status"></div>
  </div>
  <div id="sliceDock">
    <div class="sliceLabel">Camera</div>
    <div id="sliceSliderWrap">
      <input id="sliceDepth" type="range" min="0" max="1" step="0.001" value="0" />
    </div>
    <div class="sliceLabel">Center</div>
    <div id="sliceDepthVal">100%</div>
  </div>
  <div id="hoverReadout">
    <div id="hoverSwatch"></div>
    <div id="hoverTitle">Hover slice or surface</div>
    <div id="hoverValues">--</div>
    <div id="hoverActions">
      <button id="copyHex" class="copyBtn" type="button" disabled>Copy HEX</button>
      <button id="copyRgb" class="copyBtn" type="button" disabled>Copy RGB</button>
      <button id="copyOklab" class="copyBtn" type="button" disabled>Copy OKLab</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.124/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.124/examples/js/controls/OrbitControls.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById("status");
      function setStatus(text) {
        statusEl.textContent = text;
      }

      try {
        if (!window.THREE) {
          setStatus("Three.js failed to load. Check internet access and reload.");
          return;
        }

        const canvas = document.getElementById("view");
        const hStepsEl = document.getElementById("hSteps");
        const lStepsEl = document.getElementById("lSteps");
        const hStepsValEl = document.getElementById("hStepsVal");
        const lStepsValEl = document.getElementById("lStepsVal");
        const sliceDepthEl = document.getElementById("sliceDepth");
        const sliceDepthValEl = document.getElementById("sliceDepthVal");
        const hoverTitleEl = document.getElementById("hoverTitle");
        const hoverValuesEl = document.getElementById("hoverValues");
        const hoverSwatchEl = document.getElementById("hoverSwatch");
        const copyHexBtn = document.getElementById("copyHex");
        const copyRgbBtn = document.getElementById("copyRgb");
        const copyOklabBtn = document.getElementById("copyOklab");
        const rebuildBtn = document.getElementById("rebuild");
        const toggleWireBtn = document.getElementById("toggleWire");

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.localClippingEnabled = true;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x07090c);

        const camera = new THREE.PerspectiveCamera(48, 1, 0.01, 100);
        camera.position.set(1.6, 1.2, 1.6);

        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);
        controls.minDistance = 0.4;
        controls.maxDistance = 6.0;

        scene.add(new THREE.AmbientLight(0xffffff, 0.55));
        const keyLight = new THREE.DirectionalLight(0xffffff, 0.7);
        keyLight.position.set(2, 2, 1.5);
        scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0x99bbff, 0.25);
        fillLight.position.set(-2, -1.2, -1.6);
        scene.add(fillLight);

        const axis = new THREE.AxesHelper(0.8);
        axis.material.transparent = true;
        axis.material.opacity = 0.35;
        scene.add(axis);

        const root = new THREE.Group();
        scene.add(root);

        let gamutMesh = null;
        let wireframe = null;
        let sliceDirty = true;
        let hoverDirty = true;
        let pointerOnCanvas = false;
        let pointerOverColor = false;
        let liveSample = null;
        let liveSourceLabel = "";
        let pinnedSample = null;
        let pinnedSourceLabel = "";
        let hoverPinned = false;

        const PI2 = Math.PI * 2;
        const CHROMA_SCALE = 1.65;
        const SECTION_SIZE = 2.6;
        const Z_AXIS = new THREE.Vector3(0, 0, 1);
        const tmpForward = new THREE.Vector3();
        const tmpSlicePoint = new THREE.Vector3();
        const tmpQuat = new THREE.Quaternion();
        const raycaster = new THREE.Raycaster();
        const pointerNdc = new THREE.Vector2(0, 0);
        const sectionPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
        const sectionShaderMaterial = new THREE.ShaderMaterial({
          uniforms: {
            uChromaScale: { value: CHROMA_SCALE }
          },
          vertexShader: [
            "varying vec3 vWorldPos;",
            "void main() {",
            "  vec4 world = modelMatrix * vec4(position, 1.0);",
            "  vWorldPos = world.xyz;",
            "  gl_Position = projectionMatrix * viewMatrix * world;",
            "}"
          ].join("\n"),
          fragmentShader: [
            "precision highp float;",
            "uniform float uChromaScale;",
            "varying vec3 vWorldPos;",
            "",
            "vec3 oklabToLinearRgb(float L, float a, float b) {",
            "  float l_ = L + 0.3963377774 * a + 0.2158037573 * b;",
            "  float m_ = L - 0.1055613458 * a - 0.0638541728 * b;",
            "  float s_ = L - 0.0894841775 * a - 1.2914855480 * b;",
            "  float l = l_ * l_ * l_;",
            "  float m = m_ * m_ * m_;",
            "  float s = s_ * s_ * s_;",
            "  return vec3(",
            "    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,",
            "   -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,",
            "   -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s",
            "  );",
            "}",
            "",
            "float linearToSrgb(float x) {",
            "  x = clamp(x, 0.0, 1.0);",
            "  return x <= 0.0031308 ? 12.92 * x : 1.055 * pow(x, 1.0 / 2.4) - 0.055;",
            "}",
            "",
            "void main() {",
            "  float L = vWorldPos.y + 0.5;",
            "  float a = vWorldPos.x / uChromaScale;",
            "  float b = vWorldPos.z / uChromaScale;",
            "",
            "  if (L < 0.0 || L > 1.0) discard;",
            "",
            "  vec3 rgbLin = oklabToLinearRgb(L, a, b);",
            "  float inLow = min(min(rgbLin.r, rgbLin.g), rgbLin.b);",
            "  float inHigh = min(min(1.0 - rgbLin.r, 1.0 - rgbLin.g), 1.0 - rgbLin.b);",
            "  float d = min(inLow, inHigh);",
            "",
            "  float aa = 0.008;",
            "  float alpha = smoothstep(-aa, aa, d);",
            "  if (alpha <= 0.002) discard;",
            "",
            "  vec3 srgb = vec3(",
            "    linearToSrgb(rgbLin.r),",
            "    linearToSrgb(rgbLin.g),",
            "    linearToSrgb(rgbLin.b)",
            "  );",
            "  gl_FragColor = vec4(srgb, alpha * 0.98);",
            "}"
          ].join("\n"),
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        const sectionPlaneMesh = new THREE.Mesh(
          new THREE.PlaneBufferGeometry(SECTION_SIZE, SECTION_SIZE),
          sectionShaderMaterial
        );
        sectionPlaneMesh.renderOrder = 3;
        scene.add(sectionPlaneMesh);

        const sectionPlaneFrame = new THREE.LineSegments(
          new THREE.EdgesGeometry(sectionPlaneMesh.geometry),
          new THREE.LineBasicMaterial({
            color: 0xd7e7ff,
            transparent: true,
            opacity: 0.35
          })
        );
        sectionPlaneMesh.add(sectionPlaneFrame);

        function oklabToLinearRgb(L, a, b) {
          const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
          const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
          const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
          const l = l_ * l_ * l_;
          const m = m_ * m_ * m_;
          const s = s_ * s_ * s_;
          return [
            +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
            -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
          ];
        }

        function inGamut(rgb) {
          return (
            rgb[0] >= -1e-6 && rgb[0] <= 1 + 1e-6 &&
            rgb[1] >= -1e-6 && rgb[1] <= 1 + 1e-6 &&
            rgb[2] >= -1e-6 && rgb[2] <= 1 + 1e-6
          );
        }

        function maxChromaAt(L, cosH, sinH) {
          let lo = 0;
          let hi = 0.45;
          for (let i = 0; i < 24; i += 1) {
            const mid = (lo + hi) * 0.5;
            const test = oklabToLinearRgb(L, cosH * mid, sinH * mid);
            if (inGamut(test)) lo = mid;
            else hi = mid;
          }
          return lo;
        }

        function clamp01(x) {
          return Math.min(1, Math.max(0, x));
        }

        function linearToSrgb(x) {
          const c = clamp01(x);
          return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
        }

        function toByte(x) {
          return Math.max(0, Math.min(255, Math.round(x * 255)));
        }

        function hex2(v) {
          const s = v.toString(16).toUpperCase();
          return s.length < 2 ? "0" + s : s;
        }

        function sampleColorAtWorldPoint(point) {
          const L = point.y + 0.5;
          const a = point.x / CHROMA_SCALE;
          const b = point.z / CHROMA_SCALE;
          if (L < -1e-6 || L > 1 + 1e-6) return null;
          const rgbLin = oklabToLinearRgb(L, a, b);
          if (!inGamut(rgbLin)) return null;
          const r = clamp01(linearToSrgb(rgbLin[0]));
          const g = clamp01(linearToSrgb(rgbLin[1]));
          const bl = clamp01(linearToSrgb(rgbLin[2]));
          const R = toByte(r);
          const G = toByte(g);
          const B = toByte(bl);
          return {
            L: L,
            a: a,
            b: b,
            R: R,
            G: G,
            B: B,
            hex: "#" + hex2(R) + hex2(G) + hex2(B)
          };
        }

        function setHoverReadout(data, sourceLabel) {
          if (!data) {
            hoverTitleEl.textContent = "Hover slice or surface";
            hoverValuesEl.textContent = "--";
            hoverSwatchEl.style.background = "rgba(0, 0, 0, 0.3)";
            copyHexBtn.disabled = true;
            copyRgbBtn.disabled = true;
            copyOklabBtn.disabled = true;
            return;
          }
          hoverTitleEl.textContent = sourceLabel;
          hoverSwatchEl.style.background = data.hex;
          hoverValuesEl.textContent =
            data.hex +
            "  RGB " + data.R + ", " + data.G + ", " + data.B +
            "  |  L " + data.L.toFixed(3) +
            "  a " + data.a.toFixed(3) +
            "  b " + data.b.toFixed(3);
          const canCopy = hoverPinned && !pointerOverColor;
          copyHexBtn.disabled = !canCopy;
          copyRgbBtn.disabled = !canCopy;
          copyOklabBtn.disabled = !canCopy;
        }

        function updatePointerFromEvent(ev) {
          const rect = canvas.getBoundingClientRect();
          const x = (ev.clientX - rect.left) / rect.width;
          const y = (ev.clientY - rect.top) / rect.height;
          pointerNdc.set(x * 2 - 1, -(y * 2 - 1));
        }

        function pickNearestVisibleSample() {
          raycaster.setFromCamera(pointerNdc, camera);
          const targets = [];
          if (sectionPlaneMesh) targets.push(sectionPlaneMesh);
          if (gamutMesh) targets.push(gamutMesh);
          const hits = raycaster.intersectObjects(targets, false);
          for (let i = 0; i < hits.length; i += 1) {
            const hit = hits[i];
            const sample = sampleColorAtWorldPoint(hit.point);
            if (!sample) continue;
            return {
              sample: sample,
              sourceLabel: hit.object === sectionPlaneMesh ? "Slice plane" : "Surface"
            };
          }
          return null;
        }

        function tryCopyText(text, label) {
          if (!text) return;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              setStatus("Copied " + label + ": " + text);
            }).catch(function () {
              setStatus("Clipboard blocked by browser.");
            });
          } else {
            setStatus("Clipboard API unavailable in this browser.");
          }
        }

        function updateHoverReadout() {
          if (!pointerOnCanvas) {
            pointerOverColor = false;
            if (hoverPinned && pinnedSample) setHoverReadout(pinnedSample, pinnedSourceLabel + " (pinned)");
            else setHoverReadout(null);
            return;
          }
          const picked = pickNearestVisibleSample();
          pointerOverColor = !!picked;
          liveSample = picked ? picked.sample : null;
          liveSourceLabel = picked ? picked.sourceLabel : "";
          if (hoverPinned && pinnedSample) {
            setHoverReadout(pinnedSample, pinnedSourceLabel + " (pinned)");
            return;
          }
          if (picked) setHoverReadout(picked.sample, picked.sourceLabel);
          else setHoverReadout(null);
        }

        function clearOldGeometry() {
          if (gamutMesh) {
            root.remove(gamutMesh);
            gamutMesh.geometry.dispose();
            gamutMesh.material.dispose();
            gamutMesh = null;
          }
          if (wireframe) {
            root.remove(wireframe);
            wireframe.geometry.dispose();
            wireframe.material.dispose();
            wireframe = null;
          }
        }

        function updateSectionPlane() {
          camera.getWorldDirection(tmpForward).normalize();
          const centerDistance = controls.target.distanceTo(camera.position);
          const depthRatio = Number(sliceDepthEl.value);
          const tToCenter = 1 - depthRatio;
          tmpSlicePoint.copy(camera.position).addScaledVector(tmpForward, centerDistance * tToCenter);
          sectionPlane.setFromNormalAndCoplanarPoint(tmpForward, tmpSlicePoint);

          sectionPlaneMesh.position.copy(tmpSlicePoint);
          tmpQuat.setFromUnitVectors(Z_AXIS, tmpForward);
          sectionPlaneMesh.quaternion.copy(tmpQuat);
        }

        function updateSectionSlice() {
          updateSectionPlane();
        }

        function buildGeometry(hSteps, lSteps) {
          const vertsPerRing = hSteps + 1;
          const positions = [];
          const colors = [];
          const indices = [];

          for (let li = 0; li <= lSteps; li += 1) {
            const L = li / lSteps;
            for (let hi = 0; hi <= hSteps; hi += 1) {
              const h = (hi % hSteps) / hSteps * PI2;
              const cosH = Math.cos(h);
              const sinH = Math.sin(h);
              const C = maxChromaAt(L, cosH, sinH);
              const a = C * cosH;
              const b = C * sinH;

              positions.push(
                a * CHROMA_SCALE,
                L - 0.5,
                b * CHROMA_SCALE
              );

              const rgbLin = oklabToLinearRgb(L, a, b);
              colors.push(
                linearToSrgb(rgbLin[0]),
                linearToSrgb(rgbLin[1]),
                linearToSrgb(rgbLin[2])
              );
            }
          }

          for (let li = 0; li < lSteps; li += 1) {
            for (let hi = 0; hi < hSteps; hi += 1) {
              const a = li * vertsPerRing + hi;
              const b = a + 1;
              const c = a + vertsPerRing;
              const d = c + 1;
              indices.push(a, c, b);
              indices.push(b, c, d);
            }
          }

          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
          geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
          geometry.setIndex(indices);
          geometry.computeVertexNormals();
          return geometry;
        }

        function rebuildMesh() {
          const hSteps = Number(hStepsEl.value);
          const lSteps = Number(lStepsEl.value);
          setStatus("Building mesh...");
          clearOldGeometry();

          const geometry = buildGeometry(hSteps, lSteps);
          const material = new THREE.MeshStandardMaterial({
            vertexColors: true,
            roughness: 0.45,
            metalness: 0.05,
            side: THREE.DoubleSide,
            clippingPlanes: [sectionPlane]
          });
          gamutMesh = new THREE.Mesh(geometry, material);
          root.add(gamutMesh);

          const wireGeo = new THREE.WireframeGeometry(geometry);
          const wireMat = new THREE.LineBasicMaterial({
            color: 0x9bb9dc,
            transparent: true,
            opacity: 0.2,
            clippingPlanes: [sectionPlane]
          });
          wireframe = new THREE.LineSegments(wireGeo, wireMat);
          root.add(wireframe);

          const vertCount = geometry.getAttribute("position").count;
          const triCount = geometry.index.count / 3;
          setStatus("Ready: " + vertCount.toLocaleString() + " vertices, " + triCount.toLocaleString() + " triangles.");
          sliceDirty = true;
        }

        function resize() {
          const w = window.innerWidth;
          const h = window.innerHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }

        hStepsEl.addEventListener("input", function () {
          hStepsValEl.textContent = hStepsEl.value;
        });
        lStepsEl.addEventListener("input", function () {
          lStepsValEl.textContent = lStepsEl.value;
        });
        sliceDepthEl.addEventListener("input", function () {
          sliceDepthValEl.textContent = Math.round((1 - Number(sliceDepthEl.value)) * 100) + "%";
          sliceDirty = true;
        });
        rebuildBtn.addEventListener("click", rebuildMesh);
        toggleWireBtn.addEventListener("click", function () {
          if (wireframe) wireframe.visible = !wireframe.visible;
        });
        controls.addEventListener("change", function () {
          sliceDirty = true;
          hoverDirty = true;
        });
        canvas.addEventListener("pointermove", function (ev) {
          pointerOnCanvas = true;
          updatePointerFromEvent(ev);
          hoverDirty = true;
        });
        canvas.addEventListener("pointerleave", function () {
          pointerOnCanvas = false;
          pointerOverColor = false;
          hoverDirty = true;
        });
        canvas.addEventListener("pointerdown", function (ev) {
          pointerOnCanvas = true;
          updatePointerFromEvent(ev);
          hoverDirty = true;
        });
        canvas.addEventListener("click", function (ev) {
          if (ev.button !== 0) return;
          pointerOnCanvas = true;
          updatePointerFromEvent(ev);
          const picked = pickNearestVisibleSample();
          pointerOverColor = !!picked;
          if (!hoverPinned) {
            if (!picked) return;
            hoverPinned = true;
            pinnedSample = picked.sample;
            pinnedSourceLabel = picked.sourceLabel;
            setStatus("Color pinned. Move off volume, then use Copy buttons.");
          } else {
            hoverPinned = false;
            pinnedSample = null;
            pinnedSourceLabel = "";
            setStatus("Pinned color released.");
          }
          hoverDirty = true;
        });

        copyHexBtn.addEventListener("click", function () {
          if (!hoverPinned || !pinnedSample || pointerOverColor) return;
          tryCopyText(pinnedSample.hex, "HEX");
        });
        copyRgbBtn.addEventListener("click", function () {
          if (!hoverPinned || !pinnedSample || pointerOverColor) return;
          tryCopyText("rgb(" + pinnedSample.R + ", " + pinnedSample.G + ", " + pinnedSample.B + ")", "RGB");
        });
        copyOklabBtn.addEventListener("click", function () {
          if (!hoverPinned || !pinnedSample || pointerOverColor) return;
          tryCopyText(
            "oklab(" +
            pinnedSample.L.toFixed(4) + " " +
            pinnedSample.a.toFixed(4) + " " +
            pinnedSample.b.toFixed(4) + ")",
            "OKLab"
          );
        });

        window.addEventListener("resize", resize);
        resize();
        rebuildMesh();
        updateSectionSlice();
        setHoverReadout(null);

        function animate() {
          requestAnimationFrame(animate);
          controls.update();
          if (sliceDirty) {
            updateSectionSlice();
            sliceDirty = false;
            hoverDirty = true;
          }
          if (hoverDirty) {
            updateHoverReadout();
            hoverDirty = false;
          }
          renderer.render(scene, camera);
        }
        animate();
      } catch (err) {
        setStatus("Startup error: " + (err && err.message ? err.message : String(err)));
      }
    })();
  </script>
</body>
</html>
