name: Build WLED overlay

on:
  workflow_dispatch:
    inputs:
      wled-version:
        description: WLED v0.15.x tag
        required: true
        default: v0.15.1
        type: string
      target:
        description: PlatformIO environment
        required: true
        default: esp32dev_usermod_ui
        type: string
  push:
    paths:
      - .github/actions/build-wled/action.yml
      - .github/workflows/build-wled.yml
      - tools/apply_wled_015_overlay.py
      - platformio_override.sample.ini
      - usermods/**
      - WLED_VERSION

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["esp32dev_usermod_ui", "esp32dev_miri", "esp32dev_pca9634", "esp32dev_V4_miri", "esp32dev_V4_pca9634"]') }}
    steps:
      - name: Check out overlay
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            wled/.pio
          key: pio-${{ runner.os }}-${{ inputs.wled-version || 'v0.15.1' }}-${{ matrix.target }}-${{ hashFiles('platformio_override.sample.ini', 'tools/**', 'usermods/**') }}

      - name: Build WLED with usermod overlay
        uses: ./.github/actions/build-wled
        with:
          wled-version: ${{ inputs.wled-version || 'v0.15.1' }}
          target: ${{ matrix.target }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wled-${{ inputs.wled-version || 'v0.15.1' }}-${{ matrix.target }}
          path: |
            wled/.pio/build/${{ matrix.target }}/firmware.bin
            wled/.pio/build/${{ matrix.target }}/firmware.elf