; Copy to platformio_override.ini in a WLED checkout after overlaying this repo.
; WLED already loads this file via extra_configs in platformio.ini.

[platformio]
default_envs = esp32dev_usermod_ui

[env:esp32dev_usermod_ui]
extends = env:esp32dev
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D USERMOD_UI
lib_deps = ${esp32.lib_deps}

[env:esp32dev_miri]
extends = env:esp32dev
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D USERMOD_MIRI
  -D USERMOD_MIRI_TEMP_SENSOR
  -D USERMOD_MIRI_FUSE_MONITOR
  -D USERMOD_MIRI_PWM
  -D USERMOD_MIRI_BOARD_IICIE
  -D USERMOD_MIRI_COLOR_SPHERE
  -D USERMOD_UI
  -D WLED_RELEASE_NAME=\"Miri\"
  -D HW_PIN_SDA=9
  -D HW_PIN_SCL=10
  -D MIRI_I2C_SDA=9
  -D MIRI_I2C_SCL=10
lib_deps = ${esp32.lib_deps}

[env:esp32dev_pca9634]
extends = env:esp32dev
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D USERMOD_PCA9634
  -D WLED_RELEASE_NAME=\"PCA9634\"
lib_deps = ${esp32.lib_deps}

[env:esp32dev_V4_miri]
extends = env:esp32dev_V4
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D USERMOD_MIRI
  -D USERMOD_MIRI_TEMP_SENSOR
  -D USERMOD_MIRI_FUSE_MONITOR
  -D USERMOD_MIRI_PWM
  -D USERMOD_MIRI_BOARD_IICIE
  -D USERMOD_MIRI_COLOR_SPHERE
  -D USERMOD_UI
  -D WLED_RELEASE_NAME=\"Miri_V4\"
  -D HW_PIN_SDA=9
  -D HW_PIN_SCL=10
  -D MIRI_I2C_SDA=9
  -D MIRI_I2C_SCL=10
lib_deps = ${esp32_idf_V4.lib_deps}

[env:esp32dev_V4_pca9634]
extends = env:esp32dev_V4
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags}
  -D USERMOD_PCA9634
  -D WLED_RELEASE_NAME=\"PCA9634_V4\"
lib_deps = ${esp32_idf_V4.lib_deps}

